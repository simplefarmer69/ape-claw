<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApeClaw Dashboard</title>
    <meta name="description" content="ApeClaw Dashboard — live telemetry for Clawbots on ApeChain.">
    <link rel="icon" type="image/png" href="/favicon-lobster.png">
    <link rel="apple-touch-icon" href="/favicon-lobster.png">
    <style>
      html, body { height: 100%; margin: 0; background: #07070d; }
      iframe { border: 0; width: 100%; height: 100%; display: block; background: #07070d; }
      .fallback {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        background: rgba(18, 18, 38, 0.85);
        border: 1px solid rgba(45, 45, 88, 0.9);
        color: #edeefe;
        padding: 8px 10px;
        border-radius: 12px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
        font-size: 12px;
        backdrop-filter: blur(10px);
      }
      .fallback a { color: #00f0ff; text-decoration: none; }
      .fallback a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <iframe id="apeclawUi" title="ApeClaw Dashboard" referrerpolicy="no-referrer"></iframe>
    <noscript>
      <div class="fallback">JavaScript is required. Open the dashboard at <a href="/ui">/ui</a>.</div>
    </noscript>
    <div class="fallback">
      Viewing <strong>/</strong>. If anything looks off, open <a href="/ui">/ui</a>.
    </div>
    <script>
      (function () {
        var iframe = document.getElementById('apeclawUi');
        var src = '/ui/index.html' + (window.location.search || '') + (window.location.hash || '');
        iframe.src = src;
      })();
    </script>
  </body>
</html>
